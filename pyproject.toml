[project]
name = "fileengine-mcp"
version = "0.1.0"
description = "Model Context Protocol server exposing the FileEngine immutable, versioned filesystem to AI agents"
license = {text = "AGPL-3.0-or-later"}
authors = [{name = "James Hickman", email = "james@rationalboxes.com"}]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0",
    "ldap3>=2.9",
    "grpcio>=1.50",
    "protobuf>=4.21",
    "pydantic>=2.0",
    "starlette>=0.40",
    "uvicorn>=0.30",
]
# The FileEngine Python client (`fileengine`, from ../python_interface) is
# reused at runtime. Install it (`pip install ../python_interface`) or rely on
# the sibling-checkout bootstrap in fileengine_mcp._client.

[project.scripts]
fileengine-mcp = "fileengine_mcp.server:main"
fileengine-mcp-http = "fileengine_mcp.server:main_http"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
